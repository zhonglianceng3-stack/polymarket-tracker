<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Polymarket 套利监控</title>
</head>
<body>
    <h1>Polymarket 套利监控</h1>
    <p>更新时间：<span id="time">加载中...</span></p>
    <div id="content"></div>

    <script>
    // 前端每3秒主动拉取接口，不用手动刷新
    function getData() {
        fetch('/api/latest')
            .then(res => res.json())
            .then(info => {
                document.getElementById('time').innerText = info.updateTime;
                document.getElementById('content').innerText = JSON.stringify(info, null, 2)
            })
    }
    getData();
    setInterval(getData, 3000);
    </script>
</body>
</html>
