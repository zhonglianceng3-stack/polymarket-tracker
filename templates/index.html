<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket 套利监控</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Polymarket 套利监控</h1>
            <div class="status">
                <span id="connection-status" class="badge offline">离线</span>
                <span id="last-update">更新时间: --</span>
            </div>
        </header>

        <!-- 提醒区域 -->
        <section id="alerts-section" class="alerts hidden">
            <h2>🔔 套利机会提醒</h2>
            <div id="alerts-list"></div>
            <button id="clear-alerts" class="btn-secondary">清除提醒</button>
        </section>

        <!-- 两栏布局 -->
        <div class="grid">
            <!-- 马斯克盘口 -->
            <section class="card">
                <h2>🐦 马斯克推文盘口</h2>
                <div class="info-row">
                    <span class="label">当前推文数:</span>
                    <span id="musk-tweets" class="value big">--</span>
                </div>
                <div class="info-row">
                    <span class="label">预测建议:</span>
                    <span id="musk-prediction" class="value">等待分析...</span>
                </div>
                <h3>价格分布</h3>
                <div id="musk-prices" class="prices-grid">
                    <div class="loading">加载中...</div>
                </div>
            </section>

            <!-- 天气盘口 -->
            <section class="card">
                <h2>🌡️ 深圳天气盘口</h2>
                <div class="info-row">
                    <span class="label">当前温度:</span>
                    <span id="weather-current" class="value big">--°C</span>
                </div>
                <div class="info-row">
                    <span class="label">预报最高温:</span>
                    <span id="weather-forecast" class="value">--°C</span>
                </div>
                <div class="info-row">
                    <span class="label">预测建议:</span>
                    <span id="weather-prediction" class="value">等待分析...</span>
                </div>
                <h3>价格分布</h3>
                <div id="weather-prices" class="prices-grid">
                    <div class="loading">加载中...</div>
                </div>
            </section>
        </div>

        <!-- 操作区 -->
        <section class="card actions">
            <h2>⚙️ 操作</h2>
            <div class="button-group">
                <button id="refresh-btn" class="btn-primary">🔄 刷新数据</button>
                <button id="notify-btn" class="btn-secondary">🔔 开启通知</button>
            </div>
        </section>

        <!-- 历史记录 -->
        <section class="card">
            <h2>📈 历史预测记录</h2>
            <div id="history" class="history">
                <p class="empty">暂无记录</p>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
